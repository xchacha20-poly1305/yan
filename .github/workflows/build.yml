name: Build

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jvm-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Use the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "ORG_GRADLE_PROJECT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Run the JVM tests
        shell: bash
        run: ./gradlew :test

  android-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: "21"
            target: default
            arch: x86_64
          - api-level: "37.2"
            target: google_apis_ps16k
            arch: x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load -camera-back none
          disable-animations: false
          script: echo "snapshot written"
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          disable-animations: true
          script: ./gradlew :android-test:connectedDebugAndroidTest

  publish:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v'))
    needs:
      - jvm-test
      - android-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag
        if: github.ref_type == 'tag'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || [[ "$GITHUB_REF_NAME" == *-SNAPSHOT ]]; then
            echo "tag $GITHUB_REF_NAME is not a release version" >&2
            exit 1
          fi
      - uses: ./.github/actions/setup
      - name: Build
        if: github.ref_type == 'branch'
        run: ./gradlew :assemble
      - name: Publish to Maven Central
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ./gradlew :publishAndReleaseToMavenCentral -PVERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
            case "$version" in
              *-SNAPSHOT) ./gradlew :publishToMavenCentral ;;
              *) echo "VERSION_NAME=$version is not a SNAPSHOT, skipping" ;;
            esac
          fi
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: F22FA56A
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
